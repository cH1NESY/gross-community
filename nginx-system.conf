server {
    listen 80;
    server_name _;  # Принимаем все домены, можно указать конкретный домен
    
    client_max_body_size 20M;
    
    access_log /var/log/nginx/gross-community.access.log;
    error_log  /var/log/nginx/gross-community.error.log;

    # Статика фронтенда (JS, CSS, изображения и т.д.)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        root /root/gross-community/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        
        # CORS для статики (на случай если нужно)
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    # Обработка API запросов
    location /api/ {
        # Проксируем на PHP-FPM через FastCGI
        # PHP-FPM должен быть проброшен на порт 9000 (см. docker-compose.yml)
        fastcgi_pass 127.0.0.1:9000;
        
        fastcgi_index index.php;
        # Путь к index.php внутри Docker контейнера
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        include fastcgi_params;
        fastcgi_read_timeout 300;
        
        # CORS заголовки для API
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization' always;
            add_header 'Access-Control-Max-Age' '86400' always;
            add_header 'Content-Length' '0';
            add_header 'Content-Type' 'text/plain';
            return 204;
        }
        
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization' always;
    }

    # Обработка Sanctum (CSRF cookie)
    location /sanctum/ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        # Путь к index.php внутри Docker контейнера
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        include fastcgi_params;
        fastcgi_read_timeout 300;
        
        # CORS для Sanctum
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
    }

    # Storage файлы (если нужно)
    location /storage/ {
        alias /root/gross-community/backend/storage/app/public/;
        expires 1y;
        add_header Cache-Control "public";
        access_log off;
    }

    # Главная страница и hash-based routing для SPA
    # Все запросы, кроме /api/* и /sanctum/*, отдаем index.html
    location / {
        root /root/gross-community/frontend/dist;
        try_files $uri $uri/ /index.html;
        
        # CORS для главной страницы (на случай если нужно)
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    # Блокируем прямой доступ к PHP файлам
    location ~ \.php$ {
        return 404;
    }
}

